services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lites
      POSTGRES_PASSWORD: lites
      POSTGRES_DB: lites
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lites-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lites -d lites"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  lites-postgres-data:
