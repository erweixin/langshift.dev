# LLM 分档配置（示例）。复制为 llm.yaml 使用；代码只认档位（strong/medium/small），
# 模型与单价全部在这里改，不写死在代码里。单价用于成本落账（docs/unit-economics.md）。
# 价格为 2026-06 报价，调价时更新此文件即可。

provider: anthropic

tiers:
  strong:
    model: claude-opus-4-8
    price_in_per_mtok: 5.00
    price_out_per_mtok: 25.00
  medium:
    model: claude-sonnet-5
    price_in_per_mtok: 3.00
    price_out_per_mtok: 15.00
  small:
    model: claude-haiku-4-5
    price_in_per_mtok: 1.00
    price_out_per_mtok: 5.00

# 调用面 → 档位（对应 docs/product-to-platform.md 的动作表）
surfaces:
  onboarding_diagnosis: strong
  lesson_generation: strong
  review: strong            # 永不降档，见 unit-economics.md
  lesson_plan: medium
  task_generation: medium
  craft: medium
  reentry: medium
  chat: small
  rewrite: small
  profile_summary: small
  validation_assist: small

# 成本护栏（unit-economics.md 的业务参数）
budgets:
  per_user_daily_usd: 0.70        # 超出进入降级阶梯，不硬拒绝
  global_daily_usd_alert: 20.00   # 内测期全局告警线
