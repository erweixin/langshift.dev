# LLM provider routing. Copy this file to config/llm.yaml or point
# LITES_LLM_CONFIG at another path. Secrets are read from environment variables.

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY

tiers:
  strong:
    provider: deepseek
    model: deepseek-v4-pro
    price_in_per_mtok: 0.435
    cache_hit_per_mtok: 0.003625
    price_out_per_mtok: 0.87
    thinking_mode: enabled
    reasoning_effort: high
    max_output_tokens: 8192
  medium:
    provider: deepseek
    model: deepseek-v4-flash
    price_in_per_mtok: 0.14
    cache_hit_per_mtok: 0.0028
    price_out_per_mtok: 0.28
    thinking_mode: disabled
    reasoning_effort: medium
    max_output_tokens: 4096
  small:
    provider: deepseek
    model: deepseek-v4-flash
    price_in_per_mtok: 0.14
    cache_hit_per_mtok: 0.0028
    price_out_per_mtok: 0.28
    thinking_mode: disabled
    reasoning_effort: low
    max_output_tokens: 2048

surfaces:
  onboarding_diagnosis: strong
  lesson_generation: strong
  review: strong
  lesson_plan: medium
  task_generation: medium
  craft: medium
  reentry: medium
  chat: small
  rewrite: small
  profile_summary: small
  validation_assist: small

budgets:
  per_user_daily_usd: 0.70
  global_daily_usd_alert: 20.00
