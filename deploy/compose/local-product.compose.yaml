      PROMPT_ARTIFACT_HASH: ${PROMPT_ARTIFACT_HASH:?PROMPT_ARTIFACT_HASH is required}
      MODEL_ROUTE_ARTIFACT_FILE: /run/lites-local/routes.json
      MODEL_ROUTE_ARTIFACT_HASH: ${MODEL_ROUTE_ARTIFACT_HASH:?MODEL_ROUTE_ARTIFACT_HASH is required}
      TOOL_REGISTRY_ARTIFACT_FILE: /run/lites-local/tools.json
      TOOL_REGISTRY_ARTIFACT_HASH: ${TOOL_REGISTRY_ARTIFACT_HASH:?TOOL_REGISTRY_ARTIFACT_HASH is required}
      PROVIDER_REGISTRY_FILE: /run/lites-local/providers.json
      PROVIDER_REGISTRY_FILE_HASH: ${PROVIDER_REGISTRY_FILE_HASH:?PROVIDER_REGISTRY_FILE_HASH is required}
      PROVIDER_ROOT_CA_FILE: /run/lites-local/local-ca.pem
      PRIVATE_ENGINEERING_PROVIDER_HOST: model-adapter.lites.test
      EXECUTION_ID_KEY_FILE: /run/lites-local/execution-id-key
      EXECUTION_LEASE_PEPPER_FILE: /run/lites-local/execution-lease-pepper
      LLM_ID_KEY_FILE: /run/lites-local/llm-id-key
      LLM_TOKEN_PEPPER_FILE: /run/lites-local/llm-token-pepper
      BILLING_ID_KEY_FILE: /run/lites-local/billing-id-key
      AGENT_ID_KEY_FILE: /run/lites-local/agent-id-key
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/lites-local/vault-token
      S3_REGION: local
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: "true"
      S3_PAYLOAD_BUCKET: lites-payloads
