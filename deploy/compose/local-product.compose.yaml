      IDENTITY_INVITATION_TOKEN_PEPPER_FILE: /run/lites-local/invitation-pepper
      CLAIM_IDENTITY_KEY_FILE: /run/lites-local/claim-identity-key
      IDENTITY_PUBLIC_TENANT_ID: 20000000-0000-4000-8000-000000000001
    volumes: *artifact-volume
    depends_on:
      outbox-publisher: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
      vault-init: {condition: service_completed_successfully}
