    depends_on:
      agent-scheduler: {condition: service_started}
      local-model-adapter: {condition: service_started}
      vault-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    networks: [foundation]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: lites-macos-gate/web:engineering
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        LITES_API_ORIGIN: https://api-gateway:8443
    restart: on-failure
    environment:
      NODE_EXTRA_CA_CERTS: /run/lites-local/local-ca.pem
    volumes: *artifact-volume
    depends_on:
      api-gateway: {condition: service_started}
      identity-mail-worker: {condition: service_started}
      product-worker: {condition: service_started}
      agent-worker: {condition: service_started}
    networks: [foundation, local-edge]
    ports:
      - 127.0.0.1:3118:3000
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  local-edge:
    driver: bridge
