      SCHEDULER_DISPATCH_PEPPER_FILE: /run/lites-local/scheduler-dispatch-pepper
      SCHEDULER_OWNER: macos-engineering-scheduler
    volumes: *artifact-volume
    depends_on:
      outbox-publisher: {condition: service_started}
    networks: [foundation]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent-worker:
    image: lites-macos-gate/agent-worker:engineering
    build:
      <<: *go-service
      args: {SERVICE: agent-worker}
    restart: on-failure
    environment:
      <<: *local-environment
      DATABASE_URL_FILE: /run/lites-local/database-url-agent
      STORE_EPOCH_URL: https://store-epoch-authority:8443/v1/store-epoch
      STORE_EPOCH_TOKEN_FILE: /run/lites-local/epoch-token
