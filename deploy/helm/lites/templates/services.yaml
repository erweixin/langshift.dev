{{- range $name, $workload := .Values.workloads }}
{{- if and $workload.enabled $workload.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lites.workloadName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "lites.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    {{- include "lites.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - {name: {{ ternary "http" "https" (eq $name "web-app") }}, port: {{ $workload.service.port }}, targetPort: {{ ternary "health" "service" (and (eq $workload.health.type "http") (eq (int $workload.health.port) (int $workload.service.port))) }}, protocol: TCP}
    {{- range $additional := $workload.service.additionalPorts }}
    - {name: {{ $additional.name }}, port: {{ $additional.port }}, targetPort: {{ $additional.name }}, protocol: TCP}
    {{- end }}
{{- end }}
{{- end }}
