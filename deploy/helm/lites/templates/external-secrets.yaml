{{- range $name, $workload := .Values.workloads }}
{{- if $workload.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lites.workloadName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "lites.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $.Values.global.externalSecretRefreshInterval }}
  secretStoreRef:
    kind: {{ required "global.externalSecretStore.kind is required" $.Values.global.externalSecretStore.kind }}
    name: {{ required "global.externalSecretStore.name is required" $.Values.global.externalSecretStore.name }}
  target:
    name: {{ include "lites.workloadName" (dict "root" $ "name" $name) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required (printf "workloads.%s.externalSecretRemoteKey is required" $name) $workload.externalSecretRemoteKey | quote }}
{{- end }}
{{- end }}
