image:
  repository: ghcr.io/langshift/lites-reference-capacity-controller
  digest: ""
  pullPolicy: IfNotPresent

sourceCommit: ""
version: ""
region: ""
priorityClassName: ""

existingSecret: ""
dataset:
  existingPVC: ""
  file: /run/capacity/dataset.json

gateway:
  url: ""
  tlsServerName: ""
  publicOrigin: ""

telemetry:
  endpoint: ""
  tlsServerName: ""
  traceSampleRatio: "0.01"

controller:
  warmupDuration: 5m
  requestTimeout: 30s
  maximumInflight: 4000
  maximumErrorRatio: "0.0005"

service:
  port: 8443
  metricsPort: 8092

resources:
  requests: {cpu: "4", memory: 4Gi}
  limits: {cpu: "8", memory: 8Gi}

nodeSelector: {}
tolerations: []
observerNamespaceSelector: {}
observerPodSelector: {}
monitoringNamespaceSelector: {}
monitoringPodSelector: {}
gatewayEgressCIDRs: []
telemetryEgressCIDRs: []
dnsNamespaceSelector:
  kubernetes.io/metadata.name: kube-system
dnsPodSelector:
  k8s-app: kube-dns
