name: Contract Gate

on:
  pull_request:
    paths:
      - "contracts/**"
      - "security-tests/**"
      - "product-evals/**"
      - "profile-evals/**"
      - "pilot-protocols/**"
      - "behavior-manifests/**"
      - "gate-reports/stage-1/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/contract-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate and lint frozen contracts
        run: npm test
      - name: Refuse deterministic contract drift
        run: >-
          git diff --exit-code --
          contracts
          security-tests
          product-evals
          profile-evals
          pilot-protocols
          behavior-manifests
          gate-reports/stage-1/contract-snapshot.json
      - name: Execute PostgreSQL contract and isolation assertions
        run: npm run contracts:db-smoke
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-1-contract-evidence
          path: gate-reports/stage-1/
          if-no-files-found: error
          retention-days: 30
