name: Foundation Gate

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "services/**"
      - "scripts/foundation-postgres-smoke.sh"
      - "scripts/stage2-migration-smoke.sh"
      - "scripts/write-stage2-migration-report.mjs"
      - "deploy/**"
      - "config/**"
      - ".github/workflows/foundation-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Refuse formatting drift
        run: test -z "$(gofmt -l cmd internal services 2>/dev/null || true)"
      - name: Vet production packages
        run: go vet ./...
      - name: Run race-enabled foundation tests
        run: go test -race -count=1 ./...
      - name: Verify PostgreSQL tenant context and session resolution
        run: ./scripts/foundation-postgres-smoke.sh
      - name: Verify three clean installs, rollback, and re-upgrade cycles
        env:
          MIGRATION_REPORT_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/stage2-migration-smoke.sh
      - name: Upload Stage 2 foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-2-foundation-evidence
          path: gate-reports/stage-2/
          if-no-files-found: error
          retention-days: 30
