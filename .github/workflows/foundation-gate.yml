name: Foundation Gate

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "services/**"
      - "scripts/foundation-postgres-smoke.sh"
      - "scripts/stage2-infrastructure-smoke.sh"
      - "scripts/stage2-helm-gate.sh"
      - "scripts/stage2-migration-smoke.sh"
      - "scripts/stage2-nats-gate.sh"
      - "scripts/stage2-tofu-gate.sh"
      - "scripts/validate-stage2-foundation-compose.mjs"
      - "scripts/validate-stage2-helm-render.mjs"
      - "scripts/validate-stage2-nats-render.mjs"
      - "scripts/validate-stage2-tofu-contract.mjs"
      - "scripts/write-stage2-infrastructure-report.mjs"
      - "scripts/write-stage2-migration-report.mjs"
      - "scripts/verify-actions-pinned.mjs"
      - "deploy/**"
      - "config/**"
      - ".github/workflows/foundation-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Refuse formatting drift
        run: test -z "$(gofmt -l cmd internal services 2>/dev/null || true)"
      - name: Enforce immutable GitHub Action references
        run: node scripts/verify-actions-pinned.mjs
      - name: Vet production packages
        run: go vet ./...
      - name: Run race-enabled foundation tests
        run: go test -race -count=1 ./...
      - name: Verify OTLP export privacy boundary
        run: go test -race -tags=integration -count=1 ./internal/observability
      - name: Verify PostgreSQL tenant context and session resolution
        run: ./scripts/foundation-postgres-smoke.sh
      - name: Verify three clean installs, rollback, and re-upgrade cycles
        env:
          MIGRATION_REPORT_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/stage2-migration-smoke.sh
      - name: Upload Stage 2 foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-2-foundation-evidence
          path: gate-reports/stage-2/
          if-no-files-found: error
          retention-days: 30

  infrastructure-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce immutable GitHub Action references
        run: node scripts/verify-actions-pinned.mjs
      - name: Verify isolated infrastructure and telemetry paths
        env:
          INFRASTRUCTURE_REPORT_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/stage2-infrastructure-smoke.sh
      - name: Upload Stage 2 infrastructure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-2-infrastructure-evidence
          path: gate-reports/stage-2/infrastructure-smoke-report.json
          if-no-files-found: error
          retention-days: 30

  production-deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce immutable GitHub Action references
        run: node scripts/verify-actions-pinned.mjs
      - name: Verify production Helm security and availability contract
        run: ./scripts/stage2-helm-gate.sh
      - name: Verify pinned production JetStream data plane
        run: ./scripts/stage2-nats-gate.sh

  infrastructure-as-code-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce immutable GitHub Action references
        run: node scripts/verify-actions-pinned.mjs
      - name: Verify official-cloud OpenTofu contract
        run: ./scripts/stage2-tofu-gate.sh
