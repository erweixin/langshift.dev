<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5147e5" />
    <title>Lites — Offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f4;color:#191926;font:16px/1.6 system-ui,sans-serif}.c{max-width:34rem;margin:2rem;padding:2.2rem;border:1px solid #dedee7;border-radius:1.25rem;background:#fff;box-shadow:0 18px 50px rgba(29,28,48,.08)}.m{color:#5147e5;font-weight:800;letter-spacing:-.03em}.p{color:#666578}button{border:0;border-radius:.75rem;background:#5147e5;color:#fff;padding:.8rem 1rem;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="c">
      <div class="m">◆ Lites</div>
      <h1>You are offline</h1>
      <p class="p">Cached reading and drafts remain available inside the app. Lites never reports a write as complete until the server confirms it.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
